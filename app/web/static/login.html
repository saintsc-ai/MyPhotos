<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyPhotos — Sign in</title>
  <link rel="stylesheet" href="/css/pretendard.min.css">
  <!-- PWA / home-screen app (works over HTTP; offline SW needs HTTPS). -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#111111">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MyPhotos">
  <meta name="mobile-web-app-capable" content="yes">
  <script src="/js/pwa-register.js" defer></script>
  <link rel="icon" type="image/svg+xml" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">📷</text></svg>'>
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
  <script src="/js/theme-init.js"></script>

  <form class="card" id="login-form">
    <!-- Card-corner language picker. Globe icon collapses the 10-language
         list into a single button so it doesn't dominate the form
         visually. Anchored to the card (position:absolute inside the
         relatively-positioned .card) rather than the viewport, so it
         tracks the card on resize / centring. -->
    <div class="lang-fab">
      <button type="button" class="lang-trigger" id="lang-trigger"
              aria-haspopup="menu" aria-expanded="false"
              title="Language">🌐</button>
      <div class="lang-dropdown" id="lang-dropdown" role="menu" data-open="false"></div>
    </div>

    <h1 id="app-title">MyPhotos</h1>
    <p class="sub" data-i18n="login.subtitle">Sign in to continue.</p>

    <label for="username" data-i18n="login.username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username"
           autofocus required>

    <label for="password" data-i18n="login.password">Password</label>
    <input type="password" id="password" name="password"
           autocomplete="current-password" required>

    <div class="err" id="err"></div>
    <button type="submit" id="submit" data-i18n="login.submit">Sign in</button>
  </form>

  <script src="/js/i18n.js"></script>
  <script src="/js/pages/login.js"></script>
</body>
</html>
